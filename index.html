<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: draw under the notch; the touch controls pad themselves with env(safe-area-inset-*). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Doodle's Playhouse</title>
  <meta name="description" content="A first-person horror game: escape the playhouse in 5 days before Doodle the golden doodle catches you.">
  <meta name="theme-color" content="#05040a">
  <meta name="format-detection" content="telephone=no">
  <!-- "Add to Home Screen" on iPhone/iPad opens full screen, without Safari's bars. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Doodle's Playhouse">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='40' r='14' fill='%23e0a83a'/%3E%3Ccircle cx='16' cy='22' r='7' fill='%23e0a83a'/%3E%3Ccircle cx='28' cy='12' r='7' fill='%23e0a83a'/%3E%3Ccircle cx='40' cy='12' r='7' fill='%23e0a83a'/%3E%3Ccircle cx='52' cy='22' r='7' fill='%23e0a83a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="game"></div>
  <div id="ui"></div>
  <!-- Phones play sideways: main.js shows this (and pauses) on a narrow portrait touch screen. -->
  <div id="rotate" role="alert" hidden>
    <div class="rotate-phone" aria-hidden="true"></div>
    <p>Rotate your phone</p>
    <p class="rotate-sub">Doodle's Playhouse plays sideways.</p>
  </div>
  <noscript>Doodle's Playhouse needs JavaScript and a WebGL browser (Chrome, Edge, Firefox, Safari).</noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
